<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FormCheck – real-time form coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<!-- Flask serves everything inside /static automatically, so these plain paths just work.
     No Jinja needed: your "/" route only has to  return render_template("index.html")  -->
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<!-- Markup only. All behaviour lives in static/js/app.js, which finds elements by id:
     restyle or rearrange freely, but keep the ids. The backend contract is documented at the top of app.js. -->
<div class="app">

  <header>
    <div class="brand">Form<b>Check</b></div>
    <!-- Exercise buttons are generated by app.js from its EX list (add a new exercise there) -->
    <nav class="tabs" id="tabs" aria-label="Choose exercise"></nav>
    <!-- Backend status pill: Offline / Connecting / Backend connected / Demo mode -->
    <div class="status offline" id="status"><i></i><span>Offline</span></div>
  </header>

  <main>
    <!-- LEFT COLUMN: webcam, controls, live tips -->
    <div class="col">
      <div class="vid">
        <video id="video" autoplay playsinline muted></video>   <!-- live webcam -->
        <canvas id="overlay"></canvas>                          <!-- skeleton, drawn from the backend's landmarks -->
        <div class="ph" id="ph"><b id="phTitle">Camera is off</b><span id="camHint"></span></div> <!-- shown until the camera starts -->
        <div class="chip" id="chip">Ready</div>                 <!-- "phase" text from the backend (up / down …) -->
        <div class="live" id="live" aria-live="polite"></div>   <!-- the most important tip, over the video -->
      </div>

      <div class="ctrl">
        <!-- Camera picker: filled by app.js with every webcam the browser can see (built-in + external) -->
        <label class="field">Camera
          <select id="camSel" aria-label="Choose camera"><option value="">Default camera</option></select>
        </label>
        <div class="field">Goal
          <div class="step"><button data-d="-1" aria-label="Fewer reps">−</button><output id="target">10</output><button data-d="1" aria-label="More reps">+</button></div>
        </div>
        <label class="field">Rest
          <select id="restSel"><option value="30">30 sec</option><option value="45">45 sec</option><option value="60" selected>60 sec</option><option value="90">90 sec</option><option value="120">2 min</option></select>
        </label>
        <span class="sp"></span>
        <button class="btn g" id="stop" hidden>Stop camera</button>
        <!-- One button, three jobs: Start set → Finish set → Skip rest (label set by app.js) -->
        <button class="btn p" id="go">Start set</button>
      </div>

      <section class="tips"><h3>Live form tips</h3><ul id="tips"></ul></section>
    </div>

    <!-- RIGHT COLUMN: rep counter (becomes the rest timer), form score, example gif -->
    <div class="col">
      <section class="counter" id="counter">
        <div class="row"><span id="lab">Reps</span><span class="pill" id="setPill">Set 1</span></div>
        <div class="big" id="big">0</div>
        <div class="sub" id="sub"></div>
        <div class="bar"><i id="fill"></i></div>
      </section>

      <!-- Form score ring (0–100); colour and label change with the value -->
      <section class="score" id="score">
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="v" id="ringV" cx="60" cy="60" r="52"/></svg><b id="scoreNum">—</b></div>
        <div><h3>Form score</h3><strong id="scoreLab">Waiting for pose</strong><p>Live rating out of 100</p></div>
      </section>

      <!-- Example gif: app.js sets the src from /static/gifs/ ; a placeholder shows if the file is missing -->
      <section class="demo">
        <h3>Proper form</h3>
        <figure id="gifFig"><img id="gif" alt="Example of proper form" onerror="this.parentNode.classList.add('m')"><div class="miss"><span>Add your example GIF at</span><b id="gifName"></b></div></figure>
        <ul id="cues"></ul>
      </section>
    </div>
  </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
