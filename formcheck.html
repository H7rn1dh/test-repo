<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FormCheck – real-time form coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--card:#fff;--ink:#121a2b;--mu:#667085;--line:#d9dfe7;--ac:#3a47ff;--good:#12a36b;--warn:#e8890c;--bad:#e5484d}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{max-width:1240px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.03em}
.brand b{color:var(--ac)}
.tabs{display:flex;gap:4px;padding:5px;background:var(--card);border-radius:18px}
.tab{padding:11px 22px;border-radius:14px;font-weight:600;font-size:15px;color:var(--mu);transition:background .2s,color .2s}
.tab.on{background:var(--ink);color:#fff}
.status{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:14px;font-weight:500;color:var(--mu);background:var(--card);border-radius:99px}
.status i{width:8px;height:8px;border-radius:50%;background:#b6bfcc}
.status.live i{background:var(--good);animation:pulse 1.8s infinite}
.status.demo i{background:var(--warn)}
.status.connecting i{background:var(--ac)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,163,107,.5)}80%,100%{box-shadow:0 0 0 9px transparent}}
main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:28px;align-items:start}
.col{display:grid;gap:22px}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}

/* webcam */
.vid{position:relative;aspect-ratio:16/10;background:#0c111d;border-radius:28px;overflow:hidden}
.vid video,.vid canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;padding:28px;text-align:center;color:#9aa4b8;font-size:15px}
.ph b{color:#fff;font-size:22px;font-weight:700}
.ph span{max-width:360px}
.chip,.live{position:absolute;background:rgba(12,17,29,.62);backdrop-filter:blur(12px);color:#fff;font-weight:600}
.chip{top:16px;left:16px;padding:8px 15px;border-radius:99px;font-size:14px}
.live{left:50%;bottom:18px;display:flex;align-items:center;gap:10px;max-width:90%;padding:12px 20px;border-radius:16px;font-size:16px;opacity:0;transform:translate(-50%,8px);transition:opacity .25s,transform .25s}
.live.on{opacity:1;transform:translate(-50%,0)}
.live::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c,var(--good))}
.live.warn{--c:var(--warn)}.live.bad{--c:var(--bad)}

/* controls */
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.field{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--mu)}
.step{display:flex;align-items:center;background:var(--card);border-radius:14px;color:var(--ink)}
.step button{width:38px;height:40px;font-size:20px}
.step output{min-width:30px;text-align:center;font-weight:700}
select{height:40px;padding:0 12px;border:0;border-radius:14px;background:var(--card)}
.sp{flex:1}
.btn{height:48px;padding:0 26px;border-radius:16px;font-weight:700;font-size:16px}
.btn.p{background:var(--ac);color:#fff;transition:transform .15s,box-shadow .15s}
.btn.p:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px var(--ac)}
.btn.g{background:var(--card)}

/* tips */
.tips ul{list-style:none}
.tips li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);font-size:17px;font-weight:500;animation:in .3s}
.tips li::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--c,var(--good))}
.tips li.warn{--c:var(--warn)}.tips li.bad{--c:var(--bad)}.tips li.empty{--c:var(--line);color:var(--mu)}
@keyframes in{from{opacity:0;transform:translateY(5px)}}

/* rep counter / rest timer */
.counter{--sub:var(--mu);padding:24px 26px 28px;border-radius:28px;background:var(--card);transition:background .4s,color .4s}
.counter.rest{background:var(--ink);color:#fff;--sub:#a9b3c7}
.row{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px}
.pill{padding:5px 13px;border-radius:99px;font-size:13px;background:var(--bg);color:var(--mu)}
.rest .pill{background:rgba(255,255,255,.14);color:#fff}
.big{font-size:clamp(120px,15vw,200px);line-height:.95;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin:14px 0 8px}
.big.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.08);color:var(--ac)}}
.sub{color:var(--sub);font-size:15px;min-height:1.4em}
.bar{height:8px;border-radius:9px;background:var(--bg);margin-top:20px;overflow:hidden}
.rest .bar{background:rgba(255,255,255,.16)}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--ac);transition:width .4s ease}
.rest .bar i{background:#fff;transition:width 1s linear}

/* form score */
.score{display:flex;align-items:center;gap:22px;--sc:var(--mu)}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .t{stroke:var(--line)}
.ring .v{stroke:var(--sc);stroke-dasharray:326.7;stroke-dashoffset:326.7}
.ring b{position:absolute;inset:0;display:grid;place-content:center;font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score h3{margin-bottom:2px}
.score strong{display:block;font-size:24px;font-weight:700;color:var(--sc);letter-spacing:-.02em}
.score p{font-size:14px;color:var(--mu);margin-top:2px}

/* example gif */
.demo figure{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--card)}
.demo img{width:100%;height:100%;object-fit:contain;display:block}
.miss{position:absolute;inset:0;display:none;place-content:center;justify-items:center;gap:6px;padding:18px;text-align:center;font-size:14px;color:var(--mu)}
.demo figure.m img{display:none}.demo figure.m .miss{display:grid}
.demo ul{margin:14px 0 0 18px;display:grid;gap:6px;font-size:15px;color:var(--mu)}

@media(max-width:980px){main{grid-template-columns:1fr;gap:18px}.col{display:contents}.vid{order:1}.ctrl{order:2}.counter{order:3}.score{order:4}.tips{order:5}.demo{order:6}}
@media(max-width:820px){.tabs{order:3;width:100%}.tab{flex:1;padding:11px 6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Form<b>Check</b></div>
    <nav class="tabs" id="tabs" aria-label="Choose exercise"></nav>
    <div class="status offline" id="status"><i></i><span>Offline</span></div>
  </header>

  <main>
    <div class="col">
      <div class="vid">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="ph" id="ph"><b id="phTitle">Camera is off</b><span id="camHint"></span></div>
        <div class="chip" id="chip">Ready</div>
        <div class="live" id="live" aria-live="polite"></div>
      </div>

      <div class="ctrl">
        <div class="field">Goal
          <div class="step"><button data-d="-1" aria-label="Fewer reps">−</button><output id="target">10</output><button data-d="1" aria-label="More reps">+</button></div>
        </div>
        <label class="field">Rest
          <select id="restSel"><option value="30">30 sec</option><option value="45">45 sec</option><option value="60" selected>60 sec</option><option value="90">90 sec</option><option value="120">2 min</option></select>
        </label>
        <span class="sp"></span>
        <button class="btn g" id="stop" hidden>Stop camera</button>
        <button class="btn p" id="go">Start set</button>
      </div>

      <section class="tips"><h3>Live form tips</h3><ul id="tips"></ul></section>
    </div>

    <div class="col">
      <section class="counter" id="counter">
        <div class="row"><span id="lab">Reps</span><span class="pill" id="setPill">Set 1</span></div>
        <div class="big" id="big">0</div>
        <div class="sub" id="sub"></div>
        <div class="bar"><i id="fill"></i></div>
      </section>

      <section class="score" id="score">
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="v" id="ringV" cx="60" cy="60" r="52"/></svg><b id="scoreNum">—</b></div>
        <div><h3>Form score</h3><strong id="scoreLab">Waiting for pose</strong><p>Live rating out of 100</p></div>
      </section>

      <section class="demo">
        <h3>Proper form</h3>
        <figure id="gifFig"><img id="gif" alt="Example of proper form" onerror="this.parentNode.classList.add('m')"><div class="miss"><span>Add your example GIF at</span><b id="gifName"></b></div></figure>
        <ul id="cues"></ul>
      </section>
    </div>
  </main>
</div>

<script>
/* ───────────── BACKEND CONTRACT (Python + MediaPipe Pose) ─────────────
   Transport: WebSocket at CONFIG.WS_URL (same host, path /ws by default).
   Browser → server (JSON)
     {type:"config", exercise:"pushup"|"squat"|"dip"}      on connect / exercise change
     {type:"frame", exercise, t:<ms>, image:"<base64 JPEG, no data: prefix>"}   ~10 fps
     {type:"reset"}                                         new set → zero your rep counter
   Server → browser (JSON, after each processed frame)
     {type:"feedback", reps:<int>, score:<0-100>, phase:"up"|"down"|… (optional),
      tips:[{level:"good"|"warn"|"bad", text:"…"}],
      landmarks:[{x,y,v} ×33] (optional, normalised 0-1, MediaPipe order → skeleton overlay),
      set_complete:<bool> (optional)}
   With no backend reachable the page falls back to a simulated demo (add ?demo to force it). */
const CONFIG={
  WS_URL:(location.protocol==='https:'?'wss://':'ws://')+(location.host||'localhost:8000')+'/ws',
  FPS:10, FRAME_WIDTH:480, JPEG_QUALITY:.6, DEMO_FALLBACK:true
};
const EX={
  pushup:{name:'Push-ups',gif:'static/gifs/pushup.gif',cam:'Place the camera low and side-on so your whole body is in frame.',cues:['Straight line from head to heels','Elbows about 45° from your torso','Chest to fist height, then full lockout']},
  squat:{name:'Squats',gif:'static/gifs/squat.gif',cam:'Place the camera at hip height, side-on, 6–8 ft away.',cues:['Feet shoulder-width, chest tall','Knees track over your toes','Hips below knees, heels grounded']},
  dip:{name:'Chair dips',gif:'static/gifs/chair-dip.gif',cam:'Place the camera side-on so your arms, hips and chair are visible.',cues:['Hands on the edge, fingers forward','Keep your back close to the chair','Lower to a 90° elbow bend, shoulders down']}
};
const DEMO={
  pushup:[['good','Body is in a straight line'],['warn','Hips are sagging, squeeze your glutes'],['warn','Elbows flaring, tuck them to about 45°'],['good','Great depth, chest nearly to the floor']],
  squat:[['good','Solid depth, hips below knees'],['warn','Knees caving in, push them out'],['warn','Chest dropping, stay tall'],['good','Heels planted, nice control']],
  dip:[['good','Elbows tracking straight back'],['warn','Go lower, aim for a 90° elbow bend'],['bad','Shoulders shrugging, pull them down'],['good','Back stays close to the chair']]
};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={ex:'pushup',state:'idle',reps:0,target:10,set:1,rest:60,left:0,score:null,shown:0,phase:'',tips:'',ws:null,stream:null,demo:null,timer:null,fi:null};
const video=$('#video'),overlay=$('#overlay'),grab=document.createElement('canvas'),gctx=grab.getContext('2d');
const send=o=>{if(S.ws&&S.ws.readyState===1)S.ws.send(JSON.stringify(o));};
const fmt=s=>s<60?s:Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

/* exercise selector */
$('#tabs').innerHTML=Object.entries(EX).map(([k,e])=>`<button class="tab" data-ex="${k}" aria-pressed="false">${e.name}</button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(b)selectEx(b.dataset.ex);};
function selectEx(k){
  const e=EX[k];S.ex=k;S.reps=0;S.score=null;
  if(S.state==='rest'){clearInterval(S.timer);S.state='active';}
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.ex===k;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  $('#gifFig').classList.remove('m');$('#gif').src=e.gif;$('#gifName').textContent=e.gif;
  $('#cues').innerHTML=e.cues.map(c=>`<li>${c}</li>`).join('');
  if(!S.stream)$('#camHint').textContent=e.cam;
  renderTips([]);send({type:'config',exercise:k});send({type:'reset'});render();
}

/* camera + backend connection */
async function startCamera(){
  if(S.stream)return true;
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
    video.srcObject=S.stream;await video.play();$('#ph').hidden=true;return true;
  }catch(err){$('#phTitle').textContent='Camera unavailable';$('#camHint').textContent='Allow camera access in your browser, then try again.';return false;}
}
function setStatus(s){const el=$('#status');el.className='status '+s;el.querySelector('span').textContent={offline:'Offline',connecting:'Connecting…',live:'Backend connected',demo:'Demo mode'}[s];}
function connect(){
  if(S.ws||S.demo)return;
  if(new URLSearchParams(location.search).has('demo'))return startDemo();
  setStatus('connecting');
  let ws,up=false;
  try{ws=new WebSocket(CONFIG.WS_URL);}catch(e){return CONFIG.DEMO_FALLBACK?startDemo():setStatus('offline');}
  S.ws=ws;
  ws.onopen=()=>{up=true;setStatus('live');send({type:'config',exercise:S.ex});startFrames();};
  ws.onmessage=e=>{try{onFeedback(JSON.parse(e.data));}catch(err){}};
  ws.onclose=ws.onerror=()=>{if(S.ws!==ws)return;S.ws=null;clearInterval(S.fi);(!up&&CONFIG.DEMO_FALLBACK)?startDemo():setStatus('offline');};
}
function startFrames(){
  clearInterval(S.fi);
  S.fi=setInterval(()=>{
    const w=S.ws;if(!w||w.readyState!==1||!video.videoWidth||w.bufferedAmount>1e6)return;
    grab.width=CONFIG.FRAME_WIDTH;grab.height=Math.round(video.videoHeight*CONFIG.FRAME_WIDTH/video.videoWidth);
    gctx.drawImage(video,0,0,grab.width,grab.height);
    w.send(JSON.stringify({type:'frame',exercise:S.ex,t:Date.now(),image:grab.toDataURL('image/jpeg',CONFIG.JPEG_QUALITY).split(',')[1]}));
  },1000/CONFIG.FPS);
}

/* incoming feedback */
function onFeedback(m){
  if(m.type&&m.type!=='feedback')return;
  if(typeof m.score==='number')S.score=Math.max(0,Math.min(100,m.score));
  if(m.phase!==undefined)S.phase=m.phase;
  renderTips(m.tips||[]);draw(m.landmarks);
  if(S.state==='active'){
    if(typeof m.reps==='number'&&m.reps!==S.reps){S.reps=m.reps;const b=$('#big');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
    if(S.reps>=S.target||m.set_complete)finishSet();
  }
  render();
}
function renderTips(t){
  const k=JSON.stringify(t);if(k===S.tips)return;S.tips=k;
  $('#tips').innerHTML=t.length?t.slice(0,4).map(x=>`<li class="${esc(x.level||'good')}">${esc(x.text)}</li>`).join(''):'<li class="empty">Start a set and your coaching tips will appear here.</li>';
  const top=t.find(x=>x.level==='bad')||t.find(x=>x.level==='warn')||t[0],l=$('#live');
  l.textContent=top?top.text:'';l.className='live'+(top?' on '+(top.level||'good'):'');
}
const PAIRS=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function draw(lm){
  const c=overlay,x=c.getContext('2d');
  if(video.videoWidth&&c.width!==video.videoWidth){c.width=video.videoWidth;c.height=video.videoHeight;}
  x.clearRect(0,0,c.width,c.height);
  if(!lm||!lm.length)return;
  const P=i=>lm[i]&&(lm[i].v==null||lm[i].v>.4)?[lm[i].x*c.width,lm[i].y*c.height]:null;
  x.lineWidth=Math.max(3,c.width/220);x.lineCap='round';x.strokeStyle='rgba(255,255,255,.92)';x.fillStyle='#8f9bff';
  PAIRS.forEach(([a,b])=>{const p=P(a),q=P(b);if(p&&q){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke();}});
  new Set(PAIRS.flat()).forEach(i=>{const p=P(i);if(p){x.beginPath();x.arc(p[0],p[1],x.lineWidth*1.3,0,6.3);x.fill();}});
}

/* set flow: active → rest → next set */
function finishSet(){
  if(S.state!=='active')return;
  S.state='rest';S.left=S.rest;clearInterval(S.timer);
  S.timer=setInterval(()=>{if(--S.left<=0)nextSet();else render();},1000);
  render();
}
function nextSet(){clearInterval(S.timer);S.set++;S.reps=0;S.state='active';send({type:'reset'});render();}
function stopAll(){
  if(S.stream)S.stream.getTracks().forEach(t=>t.stop());
  S.stream=null;video.srcObject=null;$('#ph').hidden=false;
  clearInterval(S.timer);clearInterval(S.fi);clearInterval(S.demo);S.demo=null;
  const w=S.ws;S.ws=null;if(w)w.close();
  Object.assign(S,{state:'idle',reps:0,set:1,score:null,phase:''});
  $('#phTitle').textContent='Camera is off';$('#camHint').textContent=EX[S.ex].cam;
  renderTips([]);draw(null);setStatus('offline');render();
}
$('#go').onclick=async()=>{
  if(S.state==='idle'){if(!await startCamera())return;connect();S.reps=0;send({type:'reset'});S.state='active';render();}
  else if(S.state==='active')finishSet();
  else nextSet();
};
$('#stop').onclick=stopAll;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.target=Math.max(1,Math.min(50,S.target+ +b.dataset.d));render();});
$('#restSel').onchange=e=>{S.rest=+e.target.value;};

/* rendering */
function render(){
  const rest=S.state==='rest';
  $('#counter').classList.toggle('rest',rest);
  $('#lab').textContent=rest?'Rest':'Reps';
  $('#setPill').textContent=rest?`Set ${S.set} done`:`Set ${S.set}`;
  $('#big').textContent=rest?fmt(S.left):S.reps;
  $('#sub').textContent=rest?'Next set starts automatically':`of ${S.target} reps`;
  $('#fill').style.width=(rest?S.left/S.rest:Math.min(1,S.reps/S.target))*100+'%';
  $('#go').textContent={idle:'Start set',active:'Finish set',rest:'Skip rest'}[S.state];
  $('#stop').hidden=S.state==='idle';
  $('#target').textContent=S.target;
  $('#chip').textContent=rest?'Resting':S.state==='idle'?'Ready':(S.phase?S.phase[0].toUpperCase()+S.phase.slice(1):'Tracking');
}
const ringV=$('#ringV'),sn=$('#scoreNum'),sl=$('#scoreLab'),sc=$('#score');
(function loop(){
  const has=S.score!==null;S.shown+=((has?S.score:0)-S.shown)*.18;
  const v=Math.round(S.shown);
  ringV.style.strokeDashoffset=326.7*(1-S.shown/100);
  sn.textContent=has?v:'—';
  sc.style.setProperty('--sc',!has?'var(--mu)':v>=80?'var(--good)':v>=60?'var(--warn)':'var(--bad)');
  sl.textContent=!has?'Waiting for pose':v>=90?'Excellent':v>=80?'Good form':v>=60?'Needs work':'Poor form';
  requestAnimationFrame(loop);
})();

/* simulated feedback so the UI can be previewed without the backend */
function startDemo(){
  if(S.demo)return;setStatus('demo');let t=0;
  S.demo=setInterval(()=>{
    t++;const L=DEMO[S.ex],i=Math.floor(t/30),a=L[i%L.length],b=L[(i+1)%L.length];
    onFeedback({score:Math.round(72+18*Math.sin(t/40)+(Math.random()-.5)*4),phase:t%24<12?'down':'up',reps:S.reps+(t%24===0&&S.state==='active'?1:0),tips:[{level:a[0],text:a[1]},{level:b[0],text:b[1]}]});
  },100);
}

selectEx('pushup');setStatus('offline');
</script>
</body>
</html>
